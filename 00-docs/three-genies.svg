<text x="250" y="384" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">the notebook / pipeline editor</text>
<rect x="60" y="424" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="250" y="444" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1D4ED8" font-weight="bold" text-anchor="middle">In this project</text>
<text x="250" y="464" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">used throughout sections 6–11</text>
<text x="250" y="479" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">to generate code</text>
<rect x="470" y="76" width="420" height="430" rx="12" fill="#CCFBF1" stroke="#0F766E" stroke-width="2.6"/>
