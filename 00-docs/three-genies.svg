<text x="680" y="123" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle">(section 11)</text>
<rect x="490" y="134" width="380" height="34" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="680" y="156" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="middle">A natural-language query interface</text>
<rect x="490" y="184" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="680" y="204" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F766E" font-weight="bold" text-anchor="middle">What it does</text>
<text x="680" y="224" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">turns an English question into</text>
<text x="680" y="239" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">SQL, runs it, returns the answer</text>
<rect x="490" y="264" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="680" y="284" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F766E" font-weight="bold" text-anchor="middle">Who uses it</text>
<text x="680" y="304" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">an analyst or business user</text>
