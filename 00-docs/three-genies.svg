<text x="680" y="444" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F766E" font-weight="bold" text-anchor="middle">In this project</text>
<text x="680" y="464" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">built in section 11 on the</text>
<text x="680" y="479" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">metric view</text>
<rect x="900" y="76" width="420" height="430" rx="12" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.6"/>
<text x="1110" y="104" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#6D28D9" font-weight="bold" text-anchor="middle">Databricks One</text>
<text x="1110" y="123" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle">(renamed "Genie" — section 12)</text>
<rect x="920" y="134" width="380" height="34" rx="7" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.4"/>
<text x="1110" y="156" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="middle">A simplified home for business users</text>
<rect x="920" y="184" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="1110" y="204" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#6D28D9" font-weight="bold" text-anchor="middle">What it does</text>
<text x="1110" y="224" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">a clean front door to dashboards</text>
<text x="1110" y="239" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">and Genie spaces — no technical UI</text>
<rect x="920" y="264" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="1110" y="284" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#6D28D9" font-weight="bold" text-anchor="middle">Who uses it</text>
<text x="1110" y="304" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">non-technical consumers who</text>
<text x="1110" y="319" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">just want answers</text>
<rect x="920" y="344" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="1110" y="364" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#6D28D9" font-weight="bold" text-anchor="middle">Where</text>
<text x="1110" y="384" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">a separate, stripped-down</text>
<text x="1110" y="399" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">workspace UI</text>
<rect x="920" y="424" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="1110" y="444" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#6D28D9" font-weight="bold" text-anchor="middle">In this project</text>
<text x="1110" y="464" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">nothing to build — it just</text>
<text x="1110" y="479" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">surfaces what you already made</text>
<rect x="40" y="524" width="1280" height="76" rx="10" fill="#FEF3C7" stroke="#B45309" stroke-width="2.4"/>
<text x="680" y="548" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12.5" fill="#B45309" font-weight="bold" text-anchor="middle">The one genuinely new capability in Databricks One</text>
<text x="680" y="570" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="normal" text-anchor="middle">You can ask a question WITHOUT knowing where the answer lives. It searches across every dashboard and Genie space at once,</text>
<text x="680" y="588" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#0F172A" font-weight="normal" text-anchor="middle">finds the relevant metric view / dashboard / space, runs the query, and shows the answer plus its source. Cross-asset search.</text>
