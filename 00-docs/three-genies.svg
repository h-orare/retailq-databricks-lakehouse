<text x="250" y="304" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">YOU, the builder, during</text>
<text x="250" y="319" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">development</text>
