<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" width="1360" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1360" height="620" fill="#FFFFFF"/>
<text x="680" y="34" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="17" fill="#0F766E" font-weight="bold" text-anchor="middle">Three different things are called "Genie" — keep them straight</text>
<text x="680" y="55" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#475569" font-weight="normal" text-anchor="middle">The tutorial uses all three names loosely. They are separate features that do separate jobs.</text>
<rect x="40" y="76" width="420" height="430" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.6"/>
<text x="250" y="104" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="15" fill="#1D4ED8" font-weight="bold" text-anchor="middle">Databricks Assistant</text>
<text x="250" y="123" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.5" fill="#475569" font-weight="normal" text-anchor="middle">(the tutorial calls it "Genie code")</text>
<rect x="60" y="134" width="380" height="34" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
<text x="250" y="156" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#0F172A" font-weight="bold" text-anchor="middle">A coding copilot inside notebooks</text>
<rect x="60" y="184" width="380" height="72" rx="7" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
<text x="250" y="204" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="10" fill="#1D4ED8" font-weight="bold" text-anchor="middle">What it does</text>
<text x="250" y="224" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">writes pipeline code, SQL,</text>
<text x="250" y="239" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="9.3" fill="#0F172A" font-weight="normal" text-anchor="middle">dashboards from a prompt</text>
